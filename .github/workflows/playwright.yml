name: Playwright Tests
on:
  push:
    branches: [ main, qa ]
  pull_request:
    branches: [ main, qa ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

      name:Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Setup Environment variables
      run: |
       if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "URL=${{ secrets.URL }}" >> $GITHUB_ENV
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> $GITHUB_ENV
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> $GITHUB_ENV
        else
          echo "URL=${{ secrets.URL_QA }}" >> $GITHUB_ENV
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL_QA }}" >> $GITHUB_ENV
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD_QA }}" >> $GITHUB_ENV
        fi
    
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
